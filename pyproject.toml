[project]
name = "gitsloth"
version = "0.1.0"
description = "Turn hours of unstaged hacking into a clean series of commits, using a local open-weight model. Never touches your working tree."
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
gitsloth = "gitsloth.cli:main"

[tool.setuptools]
packages = ["gitsloth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
